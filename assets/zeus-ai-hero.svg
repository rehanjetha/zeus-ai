<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zeus AI project banner</title>
  <desc id="desc">A stylized checkers board with minimax and alpha-beta pruning labels for Zeus AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.52" stop-color="#14213D"/>
      <stop offset="1" stop-color="#251A35"/>
    </linearGradient>
    <linearGradient id="bolt" x1="776" y1="64" x2="1000" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FACC15"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M905 48L780 262H895L818 472L1032 207H914L1005 48H905Z" fill="url(#bolt)" opacity="0.92"/>
  <path d="M58 402C217 266 376 234 542 274C705 314 819 255 1021 92" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

