    <text x="114" y="232" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">Minimax search + alpha-beta pruning</text>
    <rect x="114" y="288" width="160" height="48" rx="24" fill="#38BDF8"/>
    <text x="144" y="319" fill="#07111F" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800">depth = 4</text>
